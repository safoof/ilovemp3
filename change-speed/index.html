<!doctype html>
<html lang="en" data-root="..">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Change Speed – Speed up or slow down MP3 online | iLoveMP3</title>
    <meta name="description" content="Speed up or slow down audio from 0.5x to 2x, with or without changing the pitch. Free, and your file never leaves your device." />
    <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <script type="module" src="../assets/js/pages/speed.js"></script>
  </head>
  <body data-tool="change-speed" data-stage="upload">
    <header class="site-header" data-site-header></header>

    <main>
      <section class="hero container" data-stage-panel="upload">
        <h1>Change Speed</h1>
        <p class="lead">Speed up a podcast or lecture, or slow down a song to learn it. Keep the original pitch, or let it change like a record player.</p>
        <button type="button" class="btn btn-primary btn-xl" data-pick>Select audio file</button>
        <p class="drop-hint">or drop it here</p>
        <input type="file" id="file-input" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac" hidden />
        <div class="privacy-note"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg>Your file is processed on your device and never uploaded.</div>
      </section>

      <template id="tool-options">
        <div class="field">
          <div class="field-row"><span class="field-label">Speed</span><output class="range-value" id="speed-value"></output></div>
          <input type="range" class="range" id="speed" min="0.5" max="2" step="0.05" value="1.25" />
          <div class="chips" id="speed-presets">
            <button type="button" class="chip chip-sm" data-value="0.5">0.5×</button>
            <button type="button" class="chip chip-sm" data-value="0.75">0.75×</button>
            <button type="button" class="chip chip-sm" data-value="1.25">1.25×</button>
            <button type="button" class="chip chip-sm" data-value="1.5">1.5×</button>
            <button type="button" class="chip chip-sm" data-value="2">2×</button>
          </div>
        </div>
        <label class="check"><input type="checkbox" id="keep-pitch" checked /><span>Keep original pitch<small>Turn off for a record-player effect, where faster also sounds higher.</small></span></label>
      </template>
    </main>

    <footer class="site-footer" data-site-footer></footer>
  </body>
</html>

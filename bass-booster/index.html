<!doctype html>
<html lang="en" data-root="..">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bass Booster & Equalizer – Boost bass in MP3 online | iLoveMP3</title>
    <meta name="description" content="Boost the bass, brighten the treble or make voices clearer with a 10-band equalizer. Free, and your file never leaves your device." />
    <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <script type="module" src="../assets/js/pages/equalizer.js"></script>
  </head>
  <body data-tool="bass-booster" data-stage="upload">
    <header class="site-header" data-site-header></header>

    <main>
      <section class="hero container" data-stage-panel="upload">
        <h1>Bass Booster & Equalizer</h1>
        <p class="lead">Add punch to the bass, sparkle to the treble, or make voices easier to understand. Start from a preset and fine-tune with the 10-band equalizer.</p>
        <button type="button" class="btn btn-primary btn-xl" data-pick>Select audio file</button>
        <p class="drop-hint">or drop it here</p>
        <input type="file" id="file-input" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac" hidden />
        <div class="privacy-note"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg>Your file is processed on your device and never uploaded.</div>
      </section>

      <template id="tool-options">
        <div class="field">
          <span class="field-label">Preset</span>
          <div class="chips" id="eq-presets"></div>
        </div>
        <div class="eq" id="eq"></div>
      </template>
    </main>

    <footer class="site-footer" data-site-footer></footer>
  </body>

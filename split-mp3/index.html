<!doctype html>
<html lang="en" data-root="..">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Split MP3 – Split audio into parts online | iLoveMP3</title>
    <meta name="description" content="Split an MP3 into equal parts, every few minutes, or at silences. Great for audiobooks, podcasts and recordings. Free, and your file never leaves your device." />
    <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <script type="module" src="../assets/js/pages/split.js"></script>
  </head>
  <body data-tool="split-mp3" data-stage="upload">
    <header class="site-header" data-site-header></header>

    <main>
      <section class="hero container" data-stage-panel="upload">
        <h1>Split MP3</h1>
        <p class="lead">Break a long recording into smaller files: into equal parts, every few minutes, or wherever there’s a pause. Perfect for audiobooks, podcasts and DJ sets.</p>
        <button type="button" class="btn btn-primary btn-xl" data-pick>Select audio file</button>
        <p class="drop-hint">or drop it here</p>
        <input type="file" id="file-input" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac" hidden />
        <div class="privacy-note"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg>Your file is processed on your device and never uploaded.</div>
      </section>

      <section class="workspace container" data-stage-panel="edit" hidden>
        <div class="card">
          <div class="toolbar">
            <h2 id="file-name"></h2>
            <div class="toolbar-actions">
              <button type="button" class="btn btn-secondary btn-sm" data-pick>Choose another file</button>
            </div>
          </div>
          <div id="waveform"></div>
          <div class="time-axis"><span>0:00</span><span id="duration"></span></div>
          <h3 class="section-title" id="parts-title"></h3>
          <ol class="file-list parts-list" id="parts"></ol>
        </div>

        <aside class="card panel">
          <h2>Split options</h2>
          <div class="field">
            <span class="field-label">Split</span>
            <div class="segmented" role="radiogroup" aria-label="How to split">
              <label><input type="radio" name="mode" value="equal" checked /><span>Equal parts</span></label>
              <label><input type="radio" name="mode" value="length" /><span>By length</span></label>
              <label><input type="radio" name="mode" value="silence" /><span>At pauses</span></label>
            </div>
          </div>
          <label class="field" data-mode="equal">
            <span class="field-label">Number of parts</span>
            <input class="input" type="number" id="count" min="2" max="100" step="1" value="2" />
          </label>
          <label class="field" data-mode="length" hidden>
            <span class="field-label">Length of each part (minutes)</span>
            <input class="input" type="number" id="minutes" min="0.5" max="600" step="0.5" value="10" />
          </label>
          <div class="form-grid" data-mode="silence" hidden>
            <label class="field">
              <span class="field-label">Pause length</span>
              <select class="input" id="gap">
                <option value="1">1 second+</option>
                <option value="2" selected>2 seconds+</option>
                <option value="3">3 seconds+</option>
                <option value="5">5 seconds+</option>
              </select>
            </label>
            <label class="field">
              <span class="field-label">Silence level</span>
              <select class="input" id="threshold">
                <option value="-55">Complete</option>
                <option value="-45" selected>Very quiet</option>
                <option value="-35">Quiet</option>
              </select>
            </label>
          </div>
          <label class="field">
            <span class="field-label">Quality</span>
            <select class="input" id="bitrate">
              <option value="128">128 kbps · smaller files</option>
              <option value="160">160 kbps</option>
              <option value="192">192 kbps · recommended</option>
              <option value="256">256 kbps</option>
              <option value="320">320 kbps · best quality</option>
            </select>
          </label>
          <p class="panel-summary" id="summary"></p>
          <button type="button" class="btn btn-primary btn-lg btn-block" id="run">Split MP3</button>
        </aside>
      </section>

      <section class="working container" data-stage-panel="working" hidden>
        <h2 class="progress-label">Working…</h2>
        <div class="progress-bar"><span></span></div>
        <p class="progress-pct">0%</p>
      </section>

      <section class="done container" data-stage-panel="done" hidden>
        <div class="done-badge"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7" /></svg></div>
        <h1 id="result-title"></h1>
        <p class="done-meta" id="result-meta"></p>
        <button type="button" class="btn btn-primary btn-xl" id="download"></button>
        <ul class="file-list" id="results"></ul>
        <div class="done-links">
          <button type="button" class="btn-link" id="back">Back to options</button>
          <button type="button" class="btn-link" data-pick>Split another file</button>
        </div>
      </section>
    </main>

    <footer class="site-footer" data-site-footer></footer>
  </body>
</html>

<!doctype html>
<html lang="en" data-root="..">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Compress MP3 – Reduce MP3 file size online | iLoveMP3</title>
    <meta name="description" content="Make MP3 files smaller while keeping great sound quality. Compress several files at once. Free, and your files never leave your device." />
    <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <script type="module" src="../assets/js/pages/compress.js"></script>
  </head>
  <body data-tool="compress-mp3" data-stage="upload">
    <header class="site-header" data-site-header></header>

    <main>
      <section class="hero container" data-stage-panel="upload">
        <h1>Compress MP3</h1>
        <p class="lead">Shrink your MP3s so they're easier to email, upload and store, while keeping the best quality possible. Title, artist and cover art are kept.</p>
        <button type="button" class="btn btn-primary btn-xl" data-pick>Select MP3 files</button>
        <p class="drop-hint">or drop them here</p>
        <input type="file" id="file-input" accept="audio/*,.mp3" multiple hidden />
        <div class="privacy-note"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg>Your files are processed on your device and never uploaded.</div>
      </section>

      <section class="workspace container" data-stage-panel="edit" hidden>
        <div class="card">
          <div class="toolbar">
            <h2>Files to compress</h2>
            <div class="toolbar-actions">
              <button type="button" class="btn btn-secondary btn-sm" data-pick>Add files</button>
            </div>
          </div>
          <ul class="file-list" id="file-list"></ul>
        </div>

        <aside class="card panel">
          <h2>Compression level</h2>
          <div class="options" role="radiogroup" aria-label="Compression level">
            <label class="option">
              <input type="radio" name="level" value="light" />
              <span><strong>Light</strong><small>192 kbps. Near-original quality.</small></span>
            </label>
            <label class="option">
              <input type="radio" name="level" value="recommended" checked />
              <span><strong>Recommended</strong><small>128 kbps. Great quality, much smaller.</small></span>
            </label>
            <label class="option">
              <input type="radio" name="level" value="strong" />
              <span><strong>Strong</strong><small>96 kbps. Good for casual listening.</small></span>
            </label>
            <label class="option">
              <input type="radio" name="level" value="extreme" />
              <span><strong>Extreme</strong><small>48 kbps mono. Best for speech, podcasts and audiobooks.</small></span>
            </label>
          </div>
          <button type="button" class="btn btn-primary btn-lg btn-block" id="run">Compress MP3</button>
        </aside>
      </section>

      <section class="working container" data-stage-panel="working" hidden>
        <h2 class="progress-label">Working…</h2>
        <div class="progress-bar"><span></span></div>
        <p class="progress-pct">0%</p>
      </section>

      <section class="done container" data-stage-panel="done" hidden>
        <div class="done-badge"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7" /></svg></div>
        <h1 id="result-title"></h1>
        <p class="done-meta" id="result-meta"></p>
        <button type="button" class="btn btn-primary btn-xl" id="download"></button>
        <ul class="file-list" id="results"></ul>
        <div class="done-links">
          <button type="button" class="btn-link" id="back">Back to options</button>
          <button type="button" class="btn-link" id="restart">Compress other files</button>
        </div>
      </section>
    </main>

    <footer class="site-footer" data-site-footer></footer>
  </body>
</html>

<!doctype html>
<html lang="en" data-root="..">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Convert to MP3 – WAV, M4A, FLAC and video to MP3 | iLoveMP3</title>
    <meta name="description" content="Convert WAV, M4A, FLAC, OGG and video files to MP3, or MP3 to WAV. Free, and your files never leave your device." />
    <link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="../assets/css/style.css" />
    <script type="module" src="../assets/js/pages/convert.js"></script>
  </head>
  <body data-tool="convert-mp3" data-stage="upload">
    <header class="site-header" data-site-header></header>

    <main>
      <section class="hero container" data-stage-panel="upload">
        <h1>Convert to MP3</h1>
        <p class="lead">Turn WAV, M4A, FLAC, OGG and AAC files into MP3, or pull the audio out of a video. You can also convert MP3s to WAV.</p>
        <button type="button" class="btn btn-primary btn-xl" data-pick>Select files</button>
        <p class="drop-hint">or drop them here</p>
        <input type="file" id="file-input" accept="audio/*,video/*,.mp3,.wav,.m4a,.ogg,.flac,.mp4,.mov,.webm,.mkv" multiple hidden />
        <div class="privacy-note"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2" /><path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg>Your files are processed on your device and never uploaded.</div>
      </section>

      <section class="workspace container" data-stage-panel="edit" hidden>
        <div class="card">
          <div class="toolbar">
            <h2>Files to convert</h2>
            <div class="toolbar-actions">
              <button type="button" class="btn btn-secondary btn-sm" data-pick>Add files</button>
            </div>
          </div>
          <ul class="file-list" id="file-list"></ul>
        </div>

        <aside class="card panel">
          <h2>Convert options</h2>
          <div class="field">
            <span class="field-label">Convert to</span>
            <div class="segmented" role="radiogroup" aria-label="Output format">
              <label><input type="radio" name="format" value="mp3" checked /><span>MP3</span></label>
              <label><input type="radio" name="format" value="wav" /><span>WAV</span></label>
            </div>
          </div>
          <label class="field" id="bitrate-field">
            <span class="field-label">Quality</span>
            <select class="input" id="bitrate">
              <option value="128">128 kbps · smaller file</option>
              <option value="160">160 kbps</option>
              <option value="192" selected>192 kbps · recommended</option>
              <option value="256">256 kbps</option>
              <option value="320">320 kbps · best quality</option>
            </select>
          </label>
          <p class="help" id="format-help"></p>
          <button type="button" class="btn btn-primary btn-lg btn-block" id="run">Convert</button>
        </aside>
      </section>

      <section class="working container" data-stage-panel="working" hidden>
        <h2 class="progress-label">Working…</h2>
        <div class="progress-bar"><span></span></div>
        <p class="progress-pct">0%</p>
      </section>

      <section class="done container" data-stage-panel="done" hidden>
        <div class="done-badge"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7" /></svg></div>
        <h1 id="result-title"></h1>
        <p class="done-meta" id="result-meta"></p>
        <button type="button" class="btn btn-primary btn-xl" id="download"></button>
        <ul class="file-list" id="results"></ul>
        <div class="done-links">
          <button type="button" class="btn-link" id="back">Back to options</button>
          <button type="button" class="btn-link" id="restart">Convert other files</button>
        </div>
      </section>
    </main>

    <footer class="site-footer" data-site-footer></footer>
  </body>
</html>
